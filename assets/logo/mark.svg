<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Cortez mark">
  <title>Cortez mark</title>
  <!-- A "C" that resolves out of discrete points. The letter is the initial;
       the dissolve is the positioning — scattered observations becoming a
       signal you can decide from. Arc sweeps 50deg to 252deg (202deg, hence
       large-arc-flag 1); verified pixel-identical to a 102-point polyline of
       the same circle, so the flags are right. Dots shrink by 0.68 each step:
       a size gradient reads as emergence, where uniform segments would read
       as a loading spinner. -->
  <path d="M 88.43 93.11 A 38 38 0 1 1 52.26 27.86"
        fill="none" stroke="#0ae448" stroke-width="12" stroke-linecap="round"/>
  <circle cx="64.66" cy="26.01" r="4.08" fill="#0ae448"/>
  <circle cx="77.00" cy="28.29" r="2.77" fill="#0ae448"/>
  <circle cx="87.91" cy="34.47" r="1.89" fill="#0ae448"/>
</svg>
