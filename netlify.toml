# Next.js static export. No server runtime — Netlify serves plain files, the
# same deploy model as the previous hand-written build.
#
# `publish` is resolved RELATIVE TO `base`, so it is "out" and not "web/out" —
# the latter resolves to web/web/out, which does not exist, and the deploy
# fails with the previous build left serving.
[build]
  base    = "web"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
